<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LMD DJ Schedule</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- iOS full-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xclusive" />
    <link rel="apple-touch-icon" href="/logo-x.png" />

    <!-- Branding PWA por host: no subdomínio apoiot.* a app instala como "XTS" -->
    <script>
      (function () {
        if (location.hostname.split('.')[0] !== 'apoiot') return
        document.title = 'XTS — Técnicos'
        var m = document.querySelector('link[rel="manifest"]')
        if (m) m.setAttribute('href', '/manifest-apoiot.json')
        var icon = document.querySelector('link[rel="apple-touch-icon"]')
        if (icon) icon.setAttribute('href', '/logo-apoiot.png')
        var title = document.querySelector('meta[name="apple-mobile-web-app-title"]')
        if (title) title.setAttribute('content', 'XTS')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
